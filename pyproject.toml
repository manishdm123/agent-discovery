[project]
name = "agent-discovery"
version = "0.1.0"
description = "POC agents for an agent-registry discovery system, starting with transcript-processing agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[extensions,a2a]>=1.0.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit because the project name ("agent-discovery") doesn't match a
# single top-level package dir — these are the importable packages.
packages = ["common", "agents"]
